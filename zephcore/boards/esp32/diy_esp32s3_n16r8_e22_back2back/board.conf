# DIY ESP32-S3 N16R8 + E22-400M30S Back2Back
# E22 uses an SX1268 plus PA/LNA. SX1268 7 dBm yields about 21 dBm (129 mW)
# at the module antenna connector according to the Ebyte power table.

CONFIG_ZEPHCORE_BOARD_NAME="DIY ESP32-S3 E22 Back2Back"
CONFIG_BT_DIS_MODEL_NUMBER_STR="DIY ESP32-S3 N16R8 E22-400M30S"

CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
CONFIG_ESPTOOLPY_FLASHFREQ_80M=y

# The N16R8 module has PSRAM physically fitted, but this board revision keeps
# it unused to reserve GPIO46 for SX1268 NSS.
CONFIG_ESP_SPIRAM=n

CONFIG_ZEPHCORE_DEFAULT_LORA_433=y
CONFIG_ZEPHCORE_DEFAULT_TX_POWER_DBM=7
CONFIG_ZEPHCORE_MAX_TX_POWER_DBM=19
