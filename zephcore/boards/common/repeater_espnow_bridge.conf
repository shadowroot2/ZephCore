# ESP32 Repeater Bridge. ESP-NOW uses Wi-Fi channel 1 without association;
# BLE can be selected at runtime to bridge with an nRF repeater-bridge.
CONFIG_ZEPHCORE_ROLE_REPEATER_BRIDGE=y
CONFIG_ZEPHCORE_REPEATER_UPLINK=n
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_APP_PASSKEY=n
CONFIG_BT_BONDING_REQUIRED=n
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SETTINGS=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=4096
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_FILE=y
# The bridge can switch from ESP-NOW to BLE at runtime.  Do not rely on a
# board's companion-only controller profile: scanning and central mode are
# required for an ESP32 <-> nRF bridge.
CONFIG_ESP32_BT_CTLR_LE_MASTER=y
CONFIG_ESP32_BT_CTLR_LE_SCAN=y
