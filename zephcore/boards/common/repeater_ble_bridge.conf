# nRF Repeater Bridge: encrypted custom BLE GATT backhaul. This file follows
# repeater.conf and intentionally re-enables only the BLE pieces it needs.
CONFIG_ZEPHCORE_ROLE_REPEATER_BRIDGE=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=y
# ESP32-S3 controller may reject Secure-Connections-only pairing with an nRF
# peer after a stored bond is replaced.  L2 encryption is still mandatory for
# the bridge GATT service; permit the legacy SMP fallback for this private link.
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_APP_PASSKEY=n
# Bridge traffic is small and reliability matters more than 2M throughput.
# Avoid an ESP32-S3↔nRF PHY-update procedure during/after SMP: it was followed
# by controller disconnects 0x22/0x3e/0x08 under real packet forwarding.
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_BONDING_REQUIRED=n
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=1
# The ESP32-S3 controller rejects non-bonding Legacy SMP with nRF peers. Keep
# pairing bondable; reset its LTK only after an explicit key-missing/rejected
# SMP error or `bridge unpair`, never after a normal RF/LL disconnect.
CONFIG_BT_SETTINGS=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_FILE=y
